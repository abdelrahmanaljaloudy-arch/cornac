# Lab 6 - Duplicated code with jscpd (GitHub-hosted).
# Tests, docs, examples and Cython (.pyx) files are excluded; see LAB6_ANALYSIS.md.
name: Lab6 - Duplication

on:
  push:
    branches:
      - semester-investigation
      - 'lab6-*'

permissions:
  contents: read
  security-events: write

jobs:
  duplication:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact pushed revision
        uses: actions/checkout@v4

      - name: Analyze duplication and publish SARIF
        uses: kucherenko/jscpd@v5
        with:
          version: '5.3.2'
          reporters: console,json,sarif
          ignore: '**/node_modules/**,**/.venv/**,**/build/**,**/dist/**,**/tests/**,**/docs/**,**/examples/**,**/*.pyx,**/*.md,**/*.yml'

      - name: Keep a downloadable copy of the report (time-limited)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab6-duplication-report
          path: report/
          if-no-files-found: warn
          retention-days: 30
